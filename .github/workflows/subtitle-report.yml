name: subtitle-report

# 字幕批量进度报告 -> Telegram(定时 + 手动)
#   统计源目录 srt 数 / 硬字幕数 / 待处理组数, 结合最近运行状态, 发一条 TG 消息。
# Secrets: RCLONE_CONF(gdrive6) / PATHS_JSON(SUB_SRC/SUB_DIR) / TG_TOKEN / TG_CHAT_ID / GH_TOKEN

on:
  schedule:
    # 每 2 小时 (UTC 0 */2) = 北京 偶数点
    - cron: "0 */2 * * *"
  workflow_dispatch: {}

concurrency:
  group: subtitle-report
  cancel-in-progress: false

permissions:
  contents: read

env:
  PATHS_JSON: ${{ secrets.PATHS_JSON }}
  TG_TOKEN: ${{ secrets.TG_TOKEN }}
  TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
  GH_TOKEN: ${{ secrets.GH_TOKEN }}

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 取仓库
        uses: actions/checkout@v4

      - name: 装 rclone
        run: |
          curl -s https://downloads.rclone.org/rclone-current-linux-amd64.zip -o /tmp/r.zip
          unzip -q -o /tmp/r.zip -d /tmp
          cp /tmp/rclone-*/rclone /usr/local/bin/
          rclone version | head -1

      - name: 写 rclone 配置
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: |
          mkdir -p ~/.config/rclone
          printf '%s\n' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf

      - name: 统计并发送报告
        run: python3 subtitle_progress.py
