name: subtitle-translate

# 日文语音视频 → 日文 SRT 字幕(纯云端, 不翻译, 不烧录)
#   分片按「番号」归组 → ffmpeg 拼整片 → faster-whisper(large-v3) 日文转写
#   → 按标点重切成字幕行(单条 <=8s / <=42字) → 每个视频文件旁写同名 .srt 上传
#
# 公开仓库: 日志全部脱敏(logmask), 真实盘名/目录名/番号/链接均不出现明文。
# Secrets: RCLONE_CONF / PATHS_JSON / GH_TOKEN
# (不翻译: 不调用任何 LLM 网关, 不需要 SUBTITLE_API_* / TRANSLATE_*)

on:
  schedule:
    - cron: "23 */2 * * *"
  workflow_dispatch:
    inputs:
      apply:
        description: "true=真跑(转写+上传 srt), false=只列分组统计"
        required: false
        default: "false"
      only:
        description: "只处理某一组(按番号, 留空=全部)"
        required: false
        default: ""
      limit_groups:
        description: "最多处理前 N 组(0=不限)"
        required: false
        default: "1"
      budget_min:
        description: "本轮时间预算(分钟)"
        required: false
        default: "300"
      whisper_model:
        description: "whisper 模型(large-v3 最准 / large-v3-turbo 快 / medium / small)"
        required: false
        default: "large-v3"
      probe_only:
        description: "验证用: 只转写前 N 秒(如 120), 不上传; 0=正常全量"
        required: false
        default: "0"
      batch_tag:
        description: "批次标识(仅用于并发分组, 留空=用 run_id)"
        required: false
        default: ""
      start_index:
        description: "从待处理列表第 K 个开始(并行分批); 配合 limit_groups 划分区间"
        required: false
        default: "0"
      force:
        description: "配合 only: 即使已有同名 srt 也强制重跑"
        required: false
        default: "false"

concurrency:
  group: subtitle-translate-${{ inputs.batch_tag || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PATHS_JSON: ${{ secrets.PATHS_JSON }}
  TRANSLATE: "off"                                     # 只出日文 srt(改 on 才做中译)
  MAX_SEG_DUR: ${{ vars.MAX_SEG_DUR || '8' }}      # 单条字幕最长秒数
  MAX_SEG_CHARS: ${{ vars.MAX_SEG_CHARS || '42' }} # 单条字幕最长字数
  WHISPER_THREADS: ${{ vars.WHISPER_THREADS || '4' }}
  WHISPER_BATCH: ${{ vars.WHISPER_BATCH || '8' }}
  WHISPER_BEAM: ${{ vars.WHISPER_BEAM || '1' }}

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: 取仓库
        uses: actions/checkout@v4

      - name: 装 ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1

      - name: 装 rclone
        run: |
          curl -s https://downloads.rclone.org/rclone-current-linux-amd64.zip -o /tmp/r.zip
          unzip -q -o /tmp/r.zip -d /tmp
          cp /tmp/rclone-*/rclone /usr/local/bin/
          rclone version | head -1

      - name: 写 rclone 配置
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: |
          mkdir -p ~/.config/rclone
          printf '%s\n' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf
          test -s ~/.config/rclone/rclone.conf && echo "rclone 配置已写入"
          grep -E '^\[' ~/.config/rclone/rclone.conf | sed 's/$/: <masked>/'

      - name: 装 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 缓存 pip 与 whisper 模型权重
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/huggingface
          key: sub-${{ runner.os }}-pip-hf-v2

      - name: 装 faster-whisper
        run: |
          python3 -m pip install --quiet --upgrade pip
          python3 -m pip install --quiet "av==18.1.0" "ctranslate2==4.8.5" "faster-whisper==1.2.1"
          python3 -c "import faster_whisper, av, ctranslate2; print('fw', faster_whisper.__version__, '| av', av.__version__, '| ct2', ctranslate2.__version__)"

      - name: 跑字幕流水线(只出日文 srt)
        env:
          EVENT_NAME: ${{ github.event_name }}
          APPLY: ${{ inputs.apply || 'false' }}
          ONLY: ${{ inputs.only || '' }}
          LIMIT_GROUPS: ${{ inputs.limit_groups || '1' }}
          BUDGET_MIN: ${{ inputs.budget_min || '300' }}
          WHISPER_MODEL: ${{ inputs.whisper_model || 'large-v3' }}
          PROBE_ONLY: ${{ inputs.probe_only || '0' }}
          START_INDEX: ${{ inputs.start_index || '0' }}
          FORCE: ${{ inputs.force || 'false' }}
        run: |
          set -e
          if [ "$EVENT_NAME" = "schedule" ]; then
            APPLY="true"; LIMIT_GROUPS="3"; WHISPER_MODEL="large-v3"; START_INDEX="0"
            ONLY=""
            echo "(定时触发: 处理3组 large-v3 只出日文 srt)"
          fi
          ARGS="--limit-groups $LIMIT_GROUPS --budget-min $BUDGET_MIN --start-index $START_INDEX"
          if [ -n "$ONLY" ]; then ARGS="$ARGS --only $ONLY"; fi
          if [ "$APPLY" = "true" ]; then ARGS="$ARGS --apply"; fi
          if [ "$PROBE_ONLY" != "0" ]; then ARGS="$ARGS --probe-only $PROBE_ONLY"; fi
          if [ "$FORCE" = "true" ]; then ARGS="$ARGS --force"; fi
          python3 subtitle_translate.py $ARGS

      - name: 磁盘余量
        if: always()
        run: df -h / | tail -1

      # 自接力: 本批干完立刻补满并行(不依赖 GitHub cron —— 实测 cron 会数小时不响)。
      - name: 自接力补满并行
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          sleep $((RANDOM % 25))
          python3 subtitle_dispatch.py
