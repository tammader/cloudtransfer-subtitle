name: subtitle-translate

# 日文语音视频 → 中文 SRT 字幕(纯云端)
#   分片按「番号」归组 → ffmpeg 拼整片 → faster-whisper(large-v3) 日文转写
#   → OpenAI 兼容网关批量翻译(简体中文, 保时间轴) → 同名 .srt 上传回源目录
#
# 公开仓库: 日志全部脱敏(logmask), 真实盘名/目录名/番号/链接均不出现明文。
# Secrets: RCLONE_CONF(含源远端) / PATHS_JSON(SUB_SRC/SUB_DIR/_WORDS) /
#          SUBTITLE_API_BASE / SUBTITLE_API_KEY / SUBTITLE_MODEL / SUBTITLE_MODEL_FB

on:
  # 定时自动跑一批(不依赖会话在线)。每 6 小时一次, 每次处理 1 组(medium+硬字幕)。
  # 已有 srt 的组自动跳过(幂等), 所以每次都取当前最前面的未处理组。
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      apply:
        description: "true=真跑(转写+翻译+上传), false=只列分组统计"
        required: false
        default: "false"
      only:
        description: "只处理某一组(按番号, 留空=全部)"
        required: false
        default: ""
      limit_groups:
        description: "最多处理前 N 组(0=不限)"
        required: false
        default: "1"
      budget_min:
        description: "本轮时间预算(分钟)"
        required: false
        default: "300"
      whisper_model:
        description: "whisper 模型(medium / large-v3 / small); 默认 medium 更快"
        required: false
        default: "medium"
      probe_only:
        description: "验证用: 只转写前 N 秒(如 120), 不上传; 0=正常全量"
        required: false
        default: "0"
      batch_tag:
        description: "批次标识(仅用于并发分组, 留空=用 run_id)"
        required: false
        default: ""
      start_index:
        description: "从待处理列表第 K 个开始(并行分批); 配合 limit_groups 划分区间"
        required: false
        default: "0"
      burn_video:
        description: "true=额外烧制硬字幕 mp4(上传到 字幕版/ 子目录); false=只出 srt"
        required: false
        default: "true"
      force:
        description: "配合 only: 即使已有 srt 也强制重跑(测试用, 慎用)"
        required: false
        default: "false"
      burn_only:
        description: "补烧模式: 对有 srt 但缺字幕版视频的组只拼片+烧制(不重跑转写)"
        required: false
        default: "false"
      fix_srt:
        description: "修复模式: 重译已有 srt 的日文残留, 写回并重烧硬字幕"
        required: false
        default: "false"
      no_reburn:
        description: "配合 fix_srt: 只修 srt 不重烧视频"
        required: false
        default: "false"

concurrency:
  # 按 batch_tag 唯一, 允许多批并行跑不同组(不会互相取消); cancel-in-progress 仍关
  group: subtitle-translate-${{ inputs.batch_tag || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PATHS_JSON: ${{ secrets.PATHS_JSON }}
  SUBTITLE_API_BASE: ${{ secrets.SUBTITLE_API_BASE }}
  SUBTITLE_API_KEY: ${{ secrets.SUBTITLE_API_KEY }}
  SUBTITLE_MODEL: ${{ secrets.SUBTITLE_MODEL }}
  SUBTITLE_MODEL_FB: ${{ secrets.SUBTITLE_MODEL_FB }}

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: 取仓库
        uses: actions/checkout@v4

      - name: 装系统依赖(ffmpeg + 中文字体)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk
          ffmpeg -version | head -1
          fc-list | grep -i "noto sans cjk" | head -2 || echo "(中文字体检查)"
          df -h / | tail -1

      - name: 装 rclone
        run: |
          curl -s https://downloads.rclone.org/rclone-current-linux-amd64.zip -o /tmp/r.zip
          unzip -q -o /tmp/r.zip -d /tmp
          cp /tmp/rclone-*/rclone /usr/local/bin/
          rclone version | head -1

      - name: 写 rclone 配置
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: |
          mkdir -p ~/.config/rclone
          printf '%s\n' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf
          test -s ~/.config/rclone/rclone.conf && echo "rclone 配置已写入"
          grep -E '^\[' ~/.config/rclone/rclone.conf | sed 's/$/: <masked>/'

      - name: 装 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 装 faster-whisper
        run: |
          python3 -m pip install --quiet --upgrade pip
          # 三件套用近期自洽版本:
          #   av>=14 (有 cp311 wheel, 且 <19 避免 metadata_errors 旧坑)
          #   ctranslate2>=4.5 (修 4.4.0 的 execstack "cannot enable executable stack" bug)
          #   faster-whisper 1.2.x 官方支持上述组合
          python3 -m pip install --quiet "av==18.1.0" "ctranslate2==4.8.5" "faster-whisper==1.2.1"
          python3 -c "import faster_whisper, av, ctranslate2; print('fw', faster_whisper.__version__, '| av', av.__version__, '| ct2', ctranslate2.__version__)"

      - name: 跑字幕流水线
        env:
          EVENT_NAME: ${{ github.event_name }}
          APPLY: ${{ inputs.apply || 'false' }}
          ONLY: ${{ inputs.only || '' }}
          LIMIT_GROUPS: ${{ inputs.limit_groups || '1' }}
          BUDGET_MIN: ${{ inputs.budget_min || '300' }}
          WHISPER_MODEL: ${{ inputs.whisper_model || 'medium' }}
          PROBE_ONLY: ${{ inputs.probe_only || '0' }}
          START_INDEX: ${{ inputs.start_index || '0' }}
          BURN_VIDEO: ${{ inputs.burn_video || 'true' }}
          FORCE: ${{ inputs.force || 'false' }}
          BURN_ONLY: ${{ inputs.burn_only || 'false' }}
          FIX_SRT: ${{ inputs.fix_srt || 'false' }}
          NO_REBURN: ${{ inputs.no_reburn || 'false' }}
        run: |
          set -e
          # 定时触发(schedule)没有 inputs: 强制真跑一批(1组, medium, 硬字幕)
          if [ "$EVENT_NAME" = "schedule" ]; then
            APPLY="true"; LIMIT_GROUPS="1"; WHISPER_MODEL="medium"; START_INDEX="0"
            BURN_VIDEO="true"; ONLY=""
            echo "(定时触发: 处理1组 medium+硬字幕)"
          fi
          # BURN_VIDEO=true -> 脚本内 BURN_VIDEO 环境变量生效烧制硬字幕
          export BURN_VIDEO="$BURN_VIDEO"
          ARGS="--limit-groups $LIMIT_GROUPS --budget-min $BUDGET_MIN --start-index $START_INDEX"
          if [ -n "$ONLY" ]; then ARGS="$ARGS --only $ONLY"; fi
          if [ "$APPLY" = "true" ]; then ARGS="$ARGS --apply"; fi
          if [ "$PROBE_ONLY" != "0" ]; then ARGS="$ARGS --probe-only $PROBE_ONLY"; fi
          if [ "$FORCE" = "true" ]; then ARGS="$ARGS --force"; fi
          if [ "$BURN_ONLY" = "true" ]; then ARGS="$ARGS --burn-only"; fi
          if [ "$FIX_SRT" = "true" ]; then ARGS="$ARGS --fix-srt"; fi
          if [ "$NO_REBURN" = "true" ]; then ARGS="$ARGS --no-reburn"; fi
          python3 subtitle_translate.py $ARGS

      - name: 上传 srt 统计(可选)
        if: always()
        run: df -h / | tail -1
