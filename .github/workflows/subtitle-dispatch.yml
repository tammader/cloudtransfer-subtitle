name: subtitle-dispatch

# 字幕批量自动调度器(每 10 分钟): 把 subtitle-translate 并行批次补满到 6 路, 每路 3 组。
#   - 待处理=0 且近期无活动 -> 发一条"全部完成"到 TG
#   - 活跃 < 6 -> 自动 dispatch 差值个批次(medium+硬字幕, 幂等跳过已有 srt)
# 从此不依赖本机/会话在线 —— 全流程云上闭环。
# Secrets: GH_TOKEN / RCLONE_CONF / PATHS_JSON / TG_TOKEN / TG_CHAT_ID

on:
  schedule:
    # 每 10 分钟补一次(旧 30 分钟窗口太大: 单批 5-20 分钟就跑完, 大半时间空转)
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

concurrency:
  group: subtitle-dispatch
  cancel-in-progress: true

permissions:
  contents: read

env:
  GH_TOKEN: ${{ secrets.GH_TOKEN }}
  PATHS_JSON: ${{ secrets.PATHS_JSON }}
  TG_TOKEN: ${{ secrets.TG_TOKEN }}
  TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 取仓库
        uses: actions/checkout@v4

      - name: 装 rclone
        run: |
          curl -s https://downloads.rclone.org/rclone-current-linux-amd64.zip -o /tmp/r.zip
          unzip -q -o /tmp/r.zip -d /tmp
          cp /tmp/rclone-*/rclone /usr/local/bin/
          rclone version | head -1

      - name: 写 rclone 配置
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: |
          mkdir -p ~/.config/rclone
          printf '%s\n' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf

      - name: 检查并补发批次
        run: python3 subtitle_dispatch.py
