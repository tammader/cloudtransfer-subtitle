name: subtitle-dispatch

# 字幕批量自动调度器(每 10 分钟): 翻译阶段 —— 只出 srt, 不烧录。
#   把 subtitle-translate 并行批次(默认 6 路, 每路 3 组)补满, burn_video=false。
#   - 待办=0 且近期无活动 -> 发一条"翻译全部完成"到 TG
#   烧录阶段见 subtitle-burn.yml(PHASE=burn), 前置: 翻译全完成 + 质量校验通过。
# 从此不依赖本机/会话在线 —— 全流程云上闭环。
# Secrets: GH_TOKEN / RCLONE_CONF / PATHS_JSON / TG_TOKEN / TG_CHAT_ID

on:
  schedule:
    # 每 10 分钟补一次(旧 30 分钟窗口太大: 单批 5-20 分钟就跑完, 大半时间空转)
    # 错峰: 避开 :00/:15/:30/:45 —— 同账号下另外 31 个定时 workflow 集中在这几个分钟点,
    #       20 并发额度是账号级共享的, 撞一起会让本流程的 run 排队变慢。
    - cron: "8,18,28,38,48,58 * * * *"
  workflow_dispatch: {}

concurrency:
  group: subtitle-dispatch
  cancel-in-progress: true

permissions:
  contents: read

env:
  GH_TOKEN: ${{ secrets.GH_TOKEN }}
  PATHS_JSON: ${{ secrets.PATHS_JSON }}
  TG_TOKEN: ${{ secrets.TG_TOKEN }}
  TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
  # 本调度器只负责「翻译阶段」: 只出 srt, 不烧录(burn_video=false)
  # 烧录由 subtitle-burn.yml(PHASE=burn) 在翻译全部完成 + 质量校验通过后再跑
  PHASE: translate
  TARGET_PARALLEL: ${{ vars.TARGET_PARALLEL || '6' }}
  GROUPS_PER_RUN: ${{ vars.GROUPS_PER_RUN || '3' }}

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 取仓库
        uses: actions/checkout@v4

      - name: 装 rclone
        run: |
          curl -s https://downloads.rclone.org/rclone-current-linux-amd64.zip -o /tmp/r.zip
          unzip -q -o /tmp/r.zip -d /tmp
          cp /tmp/rclone-*/rclone /usr/local/bin/
          rclone version | head -1

      - name: 写 rclone 配置
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: |
          mkdir -p ~/.config/rclone
          printf '%s\n' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf

      - name: 检查并补发批次
        run: python3 subtitle_dispatch.py
